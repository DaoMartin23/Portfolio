  <ellipse cx="400" cy="700" rx="240" ry="36" fill="url(#ground)"/>

  <!-- base shell -->
  <use href="#shell" fill="url(#whiteShade)"/>
  <use href="#shell" fill="url(#whiteVert)"/>

  <g clip-path="url(#clip)">
    <!-- blue crown -->
    <path d="M100 60 L760 60 L760 380 C720 400 690 420 655 445
             L600 385 C580 355 560 330 540 312
             C450 300 300 305 120 335 L100 300 Z" fill="url(#blueShade)"/>
    <path d="M760 380 L760 700 L660 700 C630 640 610 560 620 500 C625 470 640 455 660 440 Z" fill="url(#blueShade)"/>
    <!-- ambient shading: right side turning away, underside -->
    <path d="M540 60 L760 60 L760 700 L640 700 C560 520 560 300 540 60 Z" fill="url(#blueRight)" filter="url(#b8)"/>
    <path d="M120 300 L200 300 L200 660 L120 660 Z" fill="#000" opacity="0.14" filter="url(#b8)"/>
    <path d="M120 585 L720 585 L720 660 L120 660 Z" fill="#1c2632" opacity="0.35" filter="url(#b14)"/>

    <!-- crown highlights -->
    <ellipse cx="335" cy="150" rx="165" ry="58" fill="url(#gloss)" opacity="0.55"/>
    <path d="M225 118 C320 86 460 84 585 122" fill="none" stroke="#fff" stroke-width="3" opacity="0.7" filter="url(#b2)"/>
    <path d="M660 250 C690 320 690 420 660 470" fill="none" stroke="#9fd0ff" stroke-width="4" opacity="0.45" filter="url(#b4)"/>
    <!-- white stripe over the crown -->
    <path d="M222 152 C320 100 470 92 592 132" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <path d="M222 165 C320 113 470 105 592 145" fill="none" stroke="#a9dcff" stroke-width="3" stroke-linecap="round"/>
    <path d="M222 140 C320 88 470 80 592 120" fill="none" stroke="#dff2ff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- livery pinstripes -->
    <path d="M110 330 C300 300 450 296 542 306 L600 380 L658 442" fill="none" stroke="#a9dcff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 340 C300 310 450 306 546 316 L604 388" fill="none" stroke="#fff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <path d="M665 452 C640 480 622 530 625 590 C628 630 640 665 655 700" fill="none" stroke="#a9dcff" stroke-width="6"/>
    <path d="M654 452 C630 480 612 530 615 590" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

    <!-- shell seam under the brow -->
    <path d="M150 455 C300 450 420 452 470 460" fill="none" stroke="#b5bec9" stroke-width="1.5" opacity="0.7"/>

    <!-- rear vents with depth -->
    <g transform="rotate(-42 625 258)">
      <g fill="#021733"><rect x="592" y="224" width="60" height="9" rx="4.5"/><rect x="605" y="248" width="60" height="9" rx="4.5"/><rect x="618" y="272" width="60" height="9" rx="4.5"/></g>
      <g fill="none" stroke="#7fb8f0" stroke-width="1.2" opacity="0.6"><rect x="592" y="224" width="60" height="9" rx="4.5"/><rect x="605" y="248" width="60" height="9" rx="4.5"/><rect x="618" y="272" width="60" height="9" rx="4.5"/></g>
    </g>
    <!-- chin vents -->
    <g>
      <g fill="#8c96a4"><rect x="206" y="472" width="56" height="8" rx="4"/><rect x="206" y="488" width="56" height="8" rx="4"/><rect x="206" y="504" width="56" height="8" rx="4"/></g>
      <g fill="none" stroke="#fff" stroke-width="1" opacity="0.8"><rect x="206" y="472" width="56" height="8" rx="4"/><rect x="206" y="488" width="56" height="8" rx="4"/><rect x="206" y="504" width="56" height="8" rx="4"/></g>
    </g>
    <!-- title on the chin bar, slanted -->
    <g transform="translate(345 520) rotate(-6) skewX(-8)">
      <text font-family="Space Grotesk, Inter, Arial, sans-serif" font-weight="800" font-size="64" fill="#034694" letter-spacing="1" y="22">MD</text>
    </g>

    <!-- bottom rubber trim -->
    <use href="#shell" fill="none" stroke="url(#rubber)" stroke-width="16" clip-path="url(#trimclip)"/>
    <use href="#shell" fill="none" stroke="#4d5662" stroke-width="2" opacity="0.6" clip-path="url(#trimclip)" transform="translate(0 -6)"/>
  </g>
  <clipPath id="trimclip"><rect x="120" y="560" width="600" height="110"/></clipPath>

  <!-- visor recess shadow -->
  <use href="#visor" fill="#000" opacity="0.45" filter="url(#b8)" transform="translate(0 8)"/>
