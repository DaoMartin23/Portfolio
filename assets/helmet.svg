      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="visorWarm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset="0.5" stop-color="#ffc46b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#c9d2dc"/>
      <stop offset="0.55" stop-color="#7a8695"/><stop offset="0.8" stop-color="#e3e9ef"/><stop offset="1" stop-color="#9aa5b2"/>
    </linearGradient>
