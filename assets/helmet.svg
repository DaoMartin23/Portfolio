    <path d="M185 410 L440 420" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
    <path d="M160 300 L200 300 L150 440 L140 440 Z" fill="#fff" opacity="0.08"/>
  </g>
  <use href="#visor" fill="none" stroke="#4e6b8c" stroke-width="1.5" opacity="0.7"/>
  <!-- tear-off tab -->
  <path d="M148 318 L126 326 L128 348 L150 342 Z" fill="url(#chrome)"/>

  <!-- pivot arm + mechanism -->
