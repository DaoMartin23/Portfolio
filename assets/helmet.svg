  <circle cx="500" cy="352" r="25" fill="url(#chrome)"/>
  <circle cx="500" cy="352" r="25" fill="none" stroke="#3f4954" stroke-width="1.5"/>
  <circle cx="500" cy="352" r="16" fill="#034694"/>
  <circle cx="500" cy="352" r="16" fill="none" stroke="#7fb8f0" stroke-width="1"/>
  <circle cx="500" cy="352" r="6" fill="#e8eef4"/>
  <path d="M497 352 L503 352" stroke="#2b3440" stroke-width="1.5"/>
  <!-- small screw on the crown -->
  <circle cx="586" cy="330" r="6" fill="url(#chrome)"/><circle cx="586" cy="330" r="2" fill="#2b3440"/>
</svg>