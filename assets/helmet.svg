    <radialGradient id="whiteShade" cx="0.28" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f4f6f9"/>
      <stop offset="0.8" stop-color="#d3d9e1"/><stop offset="1" stop-color="#9ea8b5"/>
    </radialGradient>
    <linearGradient id="whiteVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.75" stop-color="#8d97a5" stop-opacity="0"/>
      <stop offset="1" stop-color="#6e7887" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="blueShade" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#4a9cff"/><stop offset="0.35" stop-color="#1467c8"/>
      <stop offset="0.7" stop-color="#03408a"/><stop offset="1" stop-color="#011a3b"/>
    </radialGradient>
    <linearGradient id="blueRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="visorG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe3ff"/><stop offset="0.18" stop-color="#2a5f9e"/>
